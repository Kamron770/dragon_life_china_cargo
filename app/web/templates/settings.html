{% extends "base.html" %}
{% block title %}{{ t('sheets') }}{% endblock %}
{% block heading %}📊 {{ t('sheets') }}{% endblock %}
{% block content %}
<div class="card">
  {% if sheets_on %}
    <p><a href="https://docs.google.com/spreadsheets/d/{{ sheet_id }}" target="_blank">{{ t('open') }} ↗</a></p>
    <form method="post" action="/admin/sync"><button class="btn ghost">🔄 {{ t('sync_now') }}</button></form>
  {% else %}
    <p class="muted">{{ t('sheets_off') }}</p>
  {% endif %}
</div>
{% endblock %}
