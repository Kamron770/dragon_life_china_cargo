# Render Blueprint: web service (bot + panel) + PostgreSQL.
# Render → New → Blueprint → choose this repository.
services:
  - type: web
    name: dragonlife-cargo
    runtime: python
    plan: starter            # $7/mo: never sleeps (free = sleeps after 15 min)
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BOT_TOKEN
        sync: false            # asked during setup
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false            # asked during setup
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dragonlife-db
          property: connectionString

databases:
  - name: dragonlife-db
    plan: basic-256mb        # ~$6/mo + storage: no expiry date (free = deleted after a while)
    databaseName: dragonlife
    user: dragonlife
