services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: dragonlife
      POSTGRES_USER: dragonlife
      POSTGRES_PASSWORD: dragonlife
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dragonlife:dragonlife@db:5432/dragonlife
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  pgdata:
